name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Start PostgreSQL Service
        run: |
         sudo systemctl enable postgresql
         sudo systemctl start postgresql
         # Wait a few seconds for the socket to be created
         sleep 3
         pg_isready -h localhost -p 5432

      - name: Create Database User
        run: 
          sudo -u postgres psql -c "CREATE USER developer WITH PASSWORD 'developer';"

      - name: Create Test Database
        run:
          sudo -u postgres psql -c "CREATE DATABASE url_shortener_test OWNER 'developer';"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Initialize Database Schema
        run: psql -h localhost -U developer -d url_shortener_test -f sql/schema.sql

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Run tests
        run: npm test