name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: deveoper
          POSTGRES_DB: url_shortener_test

        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Initialize Database Schema
        run:
          PGPASSWORD=developer psql -h localhost -p 5432 -U developer -d url_shortener_test -f sql/schema.sql

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Run tests
        run: npm test