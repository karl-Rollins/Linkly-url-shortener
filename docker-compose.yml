services:
  postgres:
    image: postgres:16

    container_name: url-shortener-db

    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: urlshortener

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: